# App + Prometheus + Grafana on your computer.  docker compose up -d --build
# App: http://localhost:8080  Prometheus: http://localhost:9090  Grafana: http://localhost:3000 (admin / admin)
services:
  app:
    build: .
    image: finops-monitor:local
    ports: ["8080:8080"]
    environment:
      MONTHLY_BUDGET_USD: "25000"
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
