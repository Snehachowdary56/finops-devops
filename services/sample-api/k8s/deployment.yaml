apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: sample-api}
  template:
    metadata:
      labels: {app: sample-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sample-api
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: sample-api
          image: sample-api:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env: [{name: PORT, value: "8080"}]
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
