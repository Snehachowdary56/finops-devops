# App of apps: Argo CD watches gitops/apps/ and creates one Application per file in it.
# Adding a service to the platform is a pull request that adds a file there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Snehachowdary56/finops-devops
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
