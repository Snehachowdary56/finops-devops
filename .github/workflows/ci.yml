name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Ansible syntax check
        run: ansible-playbook ansible/site.yml --syntax-check
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        working-directory: terraform
        run: |
          terraform fmt -recursive -diff
          terraform init -backend=false -input=false
          terraform validate
      - name: Build Docker image
        run: docker build -t finops-monitor:ci .

  deploy-kubernetes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: finops
          config: kind-config.yaml
      - name: Build image and load it into the cluster
        run: |
          docker build -t finops-monitor:ci .
          kind load docker-image finops-monitor:ci --name finops
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_wrapper: false}
      - name: Configure with Ansible
        run: ansible-playbook ansible/site.yml --tags config,preflight -e target_env=test
      - name: Deploy with Terraform
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -var "image=finops-monitor:ci"
          terraform output
      - name: Check the rollout
        run: |
          kubectl -n finops rollout status deployment/finops-monitor --timeout=120s
          kubectl -n finops get pods,svc -o wide
      - name: Smoke test with Ansible
        run: ansible-playbook ansible/site.yml --tags smoke
      - name: Validate plain manifests against the cluster
        run: kubectl apply --dry-run=server -f k8s/finops-monitor.yaml

  monitoring:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app, Prometheus and Grafana
        run: docker compose up -d --build
      - name: Check Prometheus is scraping the app
        run: |
          for i in $(seq 1 30); do
            v=$(curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="finops"}' | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else "")' || true)
            [ "$v" = "1" ] && echo "Prometheus target is up" && break
            sleep 3
          done
          [ "$v" = "1" ]
          curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=finops_month_forecast_usd' | python3 -m json.tool
      - name: Check Grafana loaded the dashboard
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 3; done
          curl -sf -u admin:admin http://localhost:3000/api/dashboards/uid/finops | python3 -c 'import sys,json; print("Dashboard:", json.load(sys.stdin)["dashboard"]["title"])'
      - if: always()
        run: docker compose logs --tail=50
