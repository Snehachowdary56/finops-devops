name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Ansible syntax check
        run: ansible-playbook ansible/site.yml --syntax-check
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        working-directory: terraform
        run: |
          terraform fmt -recursive -diff
          terraform init -backend=false -input=false
          terraform validate
      - name: Terraform (AWS) format and validate
        working-directory: terraform-aws
        run: |
          terraform fmt -recursive -diff -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Shell script check
        run: bash -n scripts/publish_costs.sh && shellcheck scripts/publish_costs.sh
      - name: Build Docker image
        run: docker build -t finops-monitor:ci .

  deploy-kubernetes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: finops
          config: kind-config.yaml
      - name: Build image and load it into the cluster
        run: |
          docker build -t finops-monitor:ci .
          kind load docker-image finops-monitor:ci --name finops
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_wrapper: false}
      - name: Configure with Ansible
        run: ansible-playbook ansible/site.yml --tags config,preflight -e target_env=test
      - name: Deploy with Terraform
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -var "image=finops-monitor:ci"
          terraform output
      - name: Check the rollout
        run: |
          kubectl -n finops rollout status deployment/finops-monitor --timeout=120s
          kubectl -n finops get pods,svc -o wide
      - name: Check RBAC (least privilege) with kubectl auth can-i
        run: |
          SA=system:serviceaccount:finops:finops-monitor
          kubectl -n finops get deploy finops-monitor -o jsonpath='{.spec.template.spec.serviceAccountName}{"\n"}'
          [ "$(kubectl auth can-i get configmap/finops-monitor-config -n finops --as=$SA)" = "yes" ]
          for denied in "list secrets" "get secret/anything" "delete pods" "patch deployment/finops-monitor" "create configmaps"; do
            out=$(kubectl auth can-i $denied -n finops --as=$SA || true)
            echo "can-i $denied -> $out"; [ "$out" = "no" ]
          done
          out=$(kubectl auth can-i get configmaps -n kube-system --as=$SA || true)
          echo "can-i get configmaps in kube-system -> $out"; [ "$out" = "no" ]
          echo "RBAC check passed: read own config only"
      - name: Smoke test with Ansible
        run: ansible-playbook ansible/site.yml --tags smoke
      - name: Validate plain manifests against the cluster
        run: kubectl apply --dry-run=server -f k8s/finops-monitor.yaml

  monitoring:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app, Prometheus and Grafana
        run: docker compose up -d --build
      - name: Check Prometheus is scraping the app
        run: |
          for i in $(seq 1 30); do
            v=$(curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="finops"}' | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else "")' || true)
            [ "$v" = "1" ] && echo "Prometheus target is up" && break
            sleep 3
          done
          [ "$v" = "1" ]
          curl -sG http://localhost:9090/api/v1/query --data-urlencode 'query=finops_month_forecast_usd' | python3 -m json.tool
      - name: Check Grafana loaded the dashboard
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 3; done
          curl -sf -u admin:admin http://localhost:3000/api/dashboards/uid/finops | python3 -c 'import sys,json; print("Dashboard:", json.load(sys.stdin)["dashboard"]["title"])'
      - if: always()
        run: docker compose logs --tail=50

  aws-localstack:
    needs: test
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14
        ports: ["4566:4566"]
        env:
          SERVICES: s3,iam,sts,cloudwatch
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:4566/_localstack/health && break; sleep 2; done
          aws --version
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_wrapper: false}
      - name: Create AWS resources with Terraform (S3, IAM, CloudWatch alarm)
        working-directory: terraform-aws
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform output
      - name: Check resources with the AWS CLI
        run: |
          aws s3api get-bucket-versioning --bucket finops-cost-reports
          aws s3api get-bucket-encryption --bucket finops-cost-reports --query 'ServerSideEncryptionConfiguration.Rules[0]'
          aws s3api get-public-access-block --bucket finops-cost-reports
          aws iam list-attached-user-policies --user-name finops-powerbi-reader
          ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='finops-read-cost-reports'].Arn" --output text)
          V=$(aws iam get-policy --policy-arn "$ARN" --query Policy.DefaultVersionId --output text)
          aws iam get-policy-version --policy-arn "$ARN" --version-id "$V" --query PolicyVersion.Document
      - name: Publish costs with the AWS CLI script
        run: ./scripts/publish_costs.sh
      - name: Wait for the CloudWatch budget alarm
        run: |
          for i in $(seq 1 20); do
            aws cloudwatch put-metric-data --namespace FinOps --metric-name MonthForecastUSD --unit None --value 27847.88
            state=$(aws cloudwatch describe-alarms --alarm-names finops-forecast-over-budget --query 'MetricAlarms[0].StateValue' --output text)
            echo "alarm state: $state"; [ "$state" = "ALARM" ] && break
            sleep 15
          done
          [ "$state" = "ALARM" ]
          aws cloudwatch describe-alarms --alarm-names finops-forecast-over-budget --query 'MetricAlarms[0].[AlarmName,StateValue,StateReason]' --output text
          echo "CloudWatch alarm fired: forecast above budget"

  azure-azurite:
    needs: test
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10000:10000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Azure CLI version
        run: az version --output table
      - name: Publish cost reports to Azure Blob Storage (Azurite emulator)
        run: ./scripts/publish_costs_azure.sh

  # Self-service: every folder under services/ gets tested, built and checked automatically.
  services-list:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "services=$(ls -d services/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  services:
    needs: [test, services-list]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.services-list.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -q
      - name: Build the image and check its health endpoint
        run: |
          docker build -t ${{ matrix.service }}:ci .
          docker run -d --name svc -p 18080:8080 ${{ matrix.service }}:ci
          for i in $(seq 1 20); do curl -sf localhost:18080/health && break; sleep 1; done
          curl -sf localhost:18080/health
          curl -sf localhost:18080/metrics | grep -q http_requests_total
      - name: Render the Kubernetes manifests (kustomize)
        run: kubectl kustomize k8s

  # GitOps: Argo CD deploys from this repository and repairs drift on its own.
  gitops-argocd:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with: {cluster_name: gitops}
      - name: Build images and load them into the cluster
        run: |
          docker build -t finops-monitor:local .
          docker build -t sample-api:local services/sample-api
          kind load docker-image finops-monitor:local sample-api:local --name gitops
      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
      - name: Point Argo CD at this repository (app of apps)
        run: |
          kubectl apply -f gitops/root-app.yaml
      - name: Wait until every application is Synced and Healthy
        run: |
          for i in $(seq 1 72); do
            kubectl -n argocd get applications -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status --no-headers || true
            ok=$(kubectl -n argocd get applications -o json | jq '[.items[] | select(.status.sync.status=="Synced" and .status.health.status=="Healthy")] | length')
            [ "$ok" = "3" ] && echo "All 3 applications Synced and Healthy" && exit 0
            sleep 5
          done
          kubectl -n argocd get applications -o yaml | tail -80
          exit 1
      - name: Check the deployed services
        run: |
          kubectl -n finops rollout status deployment/finops-monitor --timeout=120s
          kubectl -n sample-api rollout status deployment/sample-api --timeout=120s
          kubectl -n sample-api run probe --rm -i --restart=Never --image=curlimages/curl -- -sf http://sample-api/health
      - name: Drift test - a manual change is reverted to what Git says (self-heal)
        run: |
          kubectl -n sample-api scale deployment/sample-api --replicas=0
          for i in $(seq 1 36); do
            r=$(kubectl -n sample-api get deployment sample-api -o jsonpath='{.spec.replicas}')
            echo "replicas=$r"
            [ "$r" = "2" ] && echo "Argo CD restored the deployment from Git" && exit 0
            sleep 5
          done
          exit 1
      - if: failure()
        run: kubectl get pods -A
