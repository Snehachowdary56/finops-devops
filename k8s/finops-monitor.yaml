# Plain Kubernetes manifests (same resources Terraform creates), for `kubectl apply -f k8s/`.
apiVersion: v1
kind: Namespace
metadata:
  name: finops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-monitor-config
  namespace: finops
data:
  MONTHLY_BUDGET_USD: "25000"
  AS_OF_DATE: "2026-10-30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-monitor
  namespace: finops
  labels: {app: finops-monitor}
spec:
  replicas: 2
  selector:
    matchLabels: {app: finops-monitor}
  template:
    metadata:
      labels: {app: finops-monitor}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: finops-monitor
          image: finops-monitor:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: finops-monitor-config}}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata:
  name: finops-monitor
  namespace: finops
spec:
  type: NodePort
  selector: {app: finops-monitor}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
